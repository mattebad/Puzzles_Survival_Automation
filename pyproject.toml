[tool.ruff]
target-version = "py311"
include = ["*.py"]
# Historical captures, retired source and vendored local tools are not active code.
extend-exclude = [
    ".local-tools",
    "docs/archive",
    "evidence",
    "tasks/assets",
    "tests/fixtures",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.vulture]
# Include heuristic unused functions/classes as well as certain dead arguments.
min_confidence = 60

[tool.mypy]
python_version = "3.11"
files = ["safe_action_core", "automation_service"]
# Analyze imported helpers for types, but report only the explicit package roots.
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
