name: Offline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-shard:
    name: Offline execution (${{ matrix.os }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    env:
      # Match the live validation process before OCR worker/library startup.
      OMP_THREAD_LIMIT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [0, 1, 2, 3]
    steps:
      - name: Enable long retained-evidence paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Retain commit history for provenance and ancestry checks.
          fetch-depth: 0
      - name: Check fresh checkout is clean
        shell: bash
        run: |
          # A fresh checkout must not report modified files on any runner
          # (line-ending normalization drift is the known failure mode).
          dirty="$(git status --porcelain)"
          if [[ -n "$dirty" ]]; then
            echo "Fresh checkout is dirty:"
            echo "$dirty"
            exit 1
          fi
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install developer dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Install offline fixture OCR on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install offline fixture OCR on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --version=5.5.3.20260724 --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Enforce shrinking lint, unused-code and safety-type budgets
        if: matrix.shard == 0
        shell: bash
        env:
          STATIC_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python -B scripts/check_static.py --base-ref "$STATIC_BASE_REF"
      - name: Repeat native Supply Depot binding checks
        if: matrix.shard == 0
        shell: bash
        run: |
          for attempt in {1..8}; do
            python -m unittest \
              tests.test_supply_depot_vision.SupplyDepotVisionTests.test_actual_hud_occluded_radial_stays_recognized_but_not_actionable \
              tests.test_supply_depot_vision.SupplyDepotVisionTests.test_native_raised_radial_uses_tight_label_and_book_occlusion_stays_blocked \
              tests.test_supply_depot_vision.SupplyDepotVisionTests.test_native_collapsed_drawer_keeps_safe_button_despite_covered_lower_caption \
              tests.test_supply_claim_button.SupplyClaimButtonNativeBindingTests.test_real_daylight_circle_survives_proposal_variation_with_same_final_gates \
              tests.test_supply_claim_button.SupplyClaimButtonNativeBindingTests.test_actual_reset_hud_caption_binds_only_with_complete_word_and_safe_button
          done
      - name: Verify every test module is discovered
        if: matrix.shard == 0
        run: python -B scripts/check_test_discovery.py
      - name: Run assigned whole-module slice of complete discovery
        run: python -B scripts/offline_suite.py run --index ${{ matrix.shard }} --count 4 --output "${{ runner.temp }}/offline-receipt/report-${{ matrix.shard }}.json"
      - name: Run the supported controlled offline check
        if: matrix.shard == 0
        run: python scripts/check.py
      - name: Compile Python sources
        if: matrix.shard == 0
        run: python -m compileall -q automation_service safe_action_core scripts tasks
      - name: Check tracked text files match declared line endings
        if: matrix.shard == 0
        shell: bash
        run: |
          # Paths declared `eol=lf` in .gitattributes must be stored with LF in
          # the index; otherwise every fresh clone starts with modified files.
          violations="$(git ls-files --eol | awk '($1=="i/crlf" || $1=="i/mixed") && $3=="attr/text" && $4=="eol=lf"')"
          if [[ -n "$violations" ]]; then
            echo "Files committed with CRLF despite eol=lf (run: git add --renormalize <path>):"
            echo "$violations"
            exit 1
          fi
      - name: Check committed diff whitespace
        if: matrix.shard == 0
        shell: bash
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$DIFF_BASE...$DIFF_HEAD"
          else
            if [[ "$DIFF_BASE" == "0000000000000000000000000000000000000000" ]]; then
              DIFF_BASE="$(git mktree </dev/null)"
            fi
            git diff --check "$DIFF_BASE" "$DIFF_HEAD"
          fi
      - name: Retain successful execution receipt
        uses: actions/upload-artifact@v7
        with:
          name: offline-${{ matrix.os }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/offline-receipt/report-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

  offline:
    # Keep the existing per-OS required-check names; receipts, not selected lists,
    # prove every discovered case actually ran exactly once on that OS.
    name: Offline checks (${{ matrix.os }})
    needs: offline-shard
    if: always()
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out coverage verifier and measured baseline
        uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Download this attempt's OS receipts
        uses: actions/download-artifact@v8
        with:
          pattern: offline-${{ matrix.os }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/offline-receipts
      - name: Require complete actual execution with no new skips
        run: python -B scripts/offline_suite.py verify --reports "${{ runner.temp }}/offline-receipts" --count 4 --platform "${{ runner.os }}"
