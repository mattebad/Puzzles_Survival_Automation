name: Offline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Offline checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Governance checks validate retained commit ancestry, not only HEAD.
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install developer dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run deterministic offline checks
        run: python scripts/check.py
      - name: Run directly affected cleanup regressions
        run: >-
          python -m unittest
          tests.test_governance_validation
          tests.test_bliss_porting_toolbox
          tests.test_daily_quest_planning
          tests.test_development_session
          tests.test_flow_delivery_orchestrator
          tests.test_flow_delivery_lean_workflow
          tests.test_runtime_trace_projection
          tests.test_resource_effect_authority_history
          tests.test_flow_delivery_token_context_hygiene.CompactHandoffTests
      - name: Compile Python sources
        run: python -m compileall -q automation_service safe_action_core scripts tasks tools
      - name: Check committed diff whitespace
        shell: bash
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$DIFF_BASE...$DIFF_HEAD"
