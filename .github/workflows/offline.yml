name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Full regression or risk-based selection"
        type: choice
        options: [full, routine]
        default: full
      base_ref:
        description: "Routine comparison base (missing history uses full fallback)"
        type: string
        required: false
      supply_stress:
        description: "Diagnostic: eight fresh-process Supply samples"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: offline-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    # Existing required-check names remain. These jobs execute and verify their
    # own declared selection; a failed step cannot be rescued by a later receipt.
    name: Offline checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      OMP_THREAD_LIMIT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ${{ github.workspace }}
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_ref }}
      OFFLINE_PROFILE: ${{ (github.event_name == 'schedule' || inputs.profile == 'full' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && 'full' || 'routine' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Enable long retained-evidence paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Check out repository and comparison history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check fresh checkout is clean
        shell: bash
        run: |
          dirty="$(git status --porcelain)"
          if [[ -n "$dirty" ]]; then
            echo "Fresh checkout is dirty:"
            echo "$dirty"
            exit 1
          fi
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install developer dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Install offline fixture OCR on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install offline fixture OCR on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --version=5.5.3.20260724 --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Enforce shrinking lint, unused-code and safety-type budgets
        if: runner.os == 'Linux' || env.OFFLINE_PROFILE == 'full'
        shell: bash
        run: python -B scripts/check_static.py --base-ref "$BASE_REF"
      - name: Execute the declared offline selection
        shell: bash
        run: |
          python -B scripts/offline_suite.py run \
            --profile "$OFFLINE_PROFILE" --base-ref "$BASE_REF" \
            --index 0 --count 1 \
            --output "${{ runner.temp }}/offline-receipt/report-0.json"
      - name: Verify actual execution and explicit omissions with no new skips
        shell: bash
        run: |
          python -B scripts/offline_suite.py verify \
            --profile "$OFFLINE_PROFILE" --base-ref "$BASE_REF" \
            --reports "${{ runner.temp }}/offline-receipt" --count 1 \
            --platform "${{ runner.os }}"
      - name: Optional Supply startup-variability diagnostic
        if: inputs.supply_stress || contains(github.event.pull_request.labels.*.name, 'ci:supply-stress')
        shell: bash
        run: |
          for attempt in {1..8}; do
            echo "Fresh-process Supply diagnostic $attempt/8"
            python -B -m unittest \
              tests.test_supply_depot_vision.SupplyDepotVisionTests.test_actual_hud_occluded_radial_stays_recognized_but_not_actionable \
              tests.test_supply_depot_vision.SupplyDepotVisionTests.test_native_raised_radial_uses_tight_label_and_book_occlusion_stays_blocked \
              tests.test_supply_depot_vision.SupplyDepotVisionTests.test_native_collapsed_drawer_keeps_safe_button_despite_covered_lower_caption \
              tests.test_supply_claim_button.SupplyClaimButtonNativeBindingTests.test_real_daylight_circle_survives_proposal_variation_with_same_final_gates \
              tests.test_supply_claim_button.SupplyClaimButtonNativeBindingTests.test_actual_reset_hud_caption_binds_only_with_complete_word_and_safe_button
          done
      - name: Compile Python sources
        run: python -B -m compileall -q automation_service safe_action_core scripts tasks
      - name: Check tracked text files match declared line endings
        shell: bash
        run: |
          violations="$(git ls-files --eol | awk '($1=="i/crlf" || $1=="i/mixed") && $3=="attr/text" && $4=="eol=lf"')"
          if [[ -n "$violations" ]]; then
            echo "Files committed with CRLF despite eol=lf:"
            echo "$violations"
            exit 1
          fi
      - name: Check committed diff whitespace
        shell: bash
        run: |
          if [[ -n "$BASE_REF" && "$BASE_REF" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$BASE_REF...HEAD"
          fi
      - name: Retain execution receipt including failed attempts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/offline-receipt/report-0.json
          if-no-files-found: error
          retention-days: 14
