name: Ticket 24 diagnostic proof

on:
  push:
    branches: [wt/ticket-24]

permissions:
  contents: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[ticket24-audit]')
    name: Diagnostic suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      OMP_THREAD_LIMIT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Enable long retained-evidence paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Install Linux OCR
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install Windows OCR
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --version=5.5.3.20260724 --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install macOS OCR
        if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Record OCR build
        run: tesseract --version
      - name: Verify complete discovery coverage
        run: python -B scripts/check_test_discovery.py
      - name: Run isolated modules then complete discovery
        id: suite
        shell: bash
        run: python -B .github/scripts/ticket24_offline_proof.py "${{ runner.temp }}/ticket24-proof"
      - name: Remove Linux OCR for missing-tool proof
        if: always() && steps.suite.outcome != 'skipped' && runner.os == 'Linux'
        run: sudo apt-get remove -y tesseract-ocr
      - name: Remove Windows OCR for missing-tool proof
        if: always() && steps.suite.outcome != 'skipped' && runner.os == 'Windows'
        run: choco uninstall tesseract --no-progress -y
      - name: Remove macOS OCR for missing-tool proof
        if: always() && steps.suite.outcome != 'skipped' && runner.os == 'macOS'
        run: brew uninstall --ignore-dependencies tesseract
      - name: Verify OCR is absent
        id: no_ocr
        if: always() && steps.suite.outcome != 'skipped'
        run: python -B -c "import shutil; assert shutil.which('tesseract') is None; print('Tesseract absence confirmed')"
      - name: Run complete discovery without optional OCR
        if: always() && steps.no_ocr.outcome == 'success'
        shell: bash
        run: python -B .github/scripts/ticket24_offline_proof.py "${{ runner.temp }}/ticket24-proof/full-no-tesseract.json" --child full
      - name: Retain immutable diagnostic receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticket24-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/ticket24-proof
          if-no-files-found: warn
          retention-days: 90

  baseline:
    if: contains(github.event.head_commit.message, '[ticket24-base]')
    name: Historical baseline diagnostic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      OMP_THREAD_LIMIT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Enable long retained-evidence paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Checkout candidate proof driver
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout unmodified historical baseline
        uses: actions/checkout@v7
        with:
          ref: d4dd8db448096ce2268b67bc0a301ce7c540594a
          path: baseline
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: baseline/requirements-dev.txt
      - run: python -m pip install --requirement baseline/requirements-dev.txt
      - name: Install Linux OCR
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install Windows OCR
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --version=5.5.3.20260724 --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install macOS OCR
        if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Record OCR build
        run: tesseract --version
      - name: Run guarded historical modules and documented discovery
        id: baseline-suite
        shell: bash
        run: >-
          python -B candidate/.github/scripts/ticket24_offline_proof.py
          "${{ runner.temp }}/ticket24-baseline-proof"
          --target-root baseline
          --baseline-namespace
          --source-commit d4dd8db448096ce2268b67bc0a301ce7c540594a
          --driver-commit "${{ github.sha }}"
      - name: Retain historical baseline receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticket24-baseline-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/ticket24-baseline-proof
          if-no-files-found: warn
          retention-days: 90

  native-probe:
    if: contains(github.event.head_commit.message, '[ticket24-probe]')
    name: Read-only Linux OCR diagnostics (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    env:
      OMP_THREAD_LIMIT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Trace native recognizers without runtime or device access
        run: python -B .github/scripts/ticket24_native_probe.py "${{ runner.temp }}/ticket24-native-probe.json"
      - name: Exercise native recognition and safety controls
        run: |
          python -B .github/scripts/ticket24_offline_proof.py "${{ runner.temp }}/ticket24-native-victory.json" --child tests.test_campaign_victory_native
          python -B .github/scripts/ticket24_offline_proof.py "${{ runner.temp }}/ticket24-native-might.json" --child tests.test_personal_might_bluestacks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ticket24-native-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/ticket24-native-*.json
          if-no-files-found: error
          retention-days: 90
